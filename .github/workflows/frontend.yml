name: Frontend

on:
  push:
    paths: ["src/**", "public/**", "index.html", "package.json", "package-lock.json", "vite.config.js", "vercel.json", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["src/**", "public/**", "index.html", "package.json", "package-lock.json", "vite.config.js", "vercel.json", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - run: npm ci
      # Falha só em vulnerabilidade alta/crítica; nunca "audit fix --force" automático.
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: vercel.json válido e CSP presente
        run: node -e "const v=require('./vercel.json');const csp=v.headers[0].headers.find(h=>h.key==='Content-Security-Policy');if(!csp||!/connect-src/.test(csp.value))process.exit(1)"
      - name: Bundle sem datasets nem segredos
        run: |
          if grep -rlE "marcadoEm.{0,6}20[0-9]{2}-|BEGIN (RSA )?PRIVATE KEY|Jwt__Chave" dist/; then
            echo "Bundle contém dados brutos ou segredos"; exit 1
          fi
